<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Private Analytics | Brandon Copeland</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%8B%3C/text%3E%3C/svg%3E" />
    <style>
      html {
        background: #fff;
      }

      html[data-theme="dark"] {
        background: #0a0712;
        color-scheme: dark;
      }

      body {
        margin: 0;
        background: #fff;
        color: #000;
      }

      html[data-theme="dark"] body {
        background: #0a0712;
        color: #f7f2ff;
      }
    </style>
    <script>
      (() => {
        const prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        let storedTheme = null;
        try {
          storedTheme = localStorage.getItem("theme");
        } catch {
          storedTheme = null;
        }
        document.documentElement.dataset.theme = storedTheme || (prefersDark ? "dark" : "light");
      })();
    </script>
    <script type="module" src="/src/insights.js"></script>
  </head>
  <body class="insights-page" data-analytics-opt-out="true">
    <main id="insights-app"></main>
  </body>
</html>
